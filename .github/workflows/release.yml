name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          cache: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      - name: Run regression tests
        shell: msys2 {0}
        run: bash build_tests.sh

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build TRNG.exe
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p build

          echo "Compiling resources (icon)..."
          windres src/resource.rc -O coff -o build/resource.res

          echo "Compiling TRNG v${VERSION}..."
          g++ -std=c++17 -O2 -s -mwindows \
              -fstack-protector-strong -D_FORTIFY_SOURCE=2 \
              -DAPP_VERSION="\"${VERSION}\"" \
              -D_WIN32_WINNT=0x0A00 \
              -DIMGUI_USE_WCHAR32 \
              -DIMGUI_IMPL_WIN32_DISABLE_GAMEPAD \
              -I"src" -I"src/core" -I"src/gui" -I"src/logic" -I"src/platform" -I"src/entropy" \
              -I"src/entropy/clock_drift" -I"src/entropy/cpu_jitter" -I"src/entropy/microphone" -I"src/crypto" \
              -I"external/imgui" -I"external/imgui/backends" \
              -o build/TRNG.exe \
              src/main.cpp \
              src/gui/gui.cpp \
              src/gui/widgets.cpp \
              src/gui/sources/source_widgets.cpp \
              src/gui/sources/input_tab.cpp \
              src/gui/sources/collection_pad.cpp \
              src/gui/output/output_types.cpp \
              src/gui/output/output_config.cpp \
              src/gui/output/number_options.cpp \
              src/gui/output/text_options.cpp \
              src/gui/output/raw_data_options.cpp \
              src/gui/output/uuid_options.cpp \
              src/gui/output/one_time_pad_options.cpp \
              src/gui/output/list_options.cpp \
              src/gui/output/generation_task.cpp \
              src/gui/output/output_result.cpp \
              src/gui/output/one_time_pad_result.cpp \
              src/logic/logic.cpp \
              src/logic/csprng.cpp \
              src/logic/output_generator.cpp \
              src/logic/output_export.cpp \
              src/logic/list_input.cpp \
              src/logic/word_lists.cpp \
              src/logic/formats/number_formats.cpp \
              src/logic/formats/text_formats.cpp \
              src/logic/formats/raw_data_format.cpp \
              src/logic/formats/uuid_formats.cpp \
              src/logic/formats/one_time_pad_format.cpp \
              src/logic/formats/list_formats.cpp \
              src/platform/dx11.cpp \
              src/platform/unicode_path.cpp \
              src/platform/secure_clipboard.cpp \
              src/platform/virtual_machine.cpp \
              src/platform/os_random.cpp \
              src/platform/screen_capture.cpp \
              src/entropy/clock_drift/clock_drift.cpp \
              src/entropy/cpu_jitter/cpu_jitter.cpp \
              src/entropy/raw_input_thread.cpp \
              src/entropy/keystroke/keystroke.cpp \
              src/entropy/mouse/mouse.cpp \
              src/entropy/microphone/microphone.cpp \
              src/entropy/pool.cpp \
              src/entropy/source_credit.cpp \
              src/crypto/sha512.cpp \
              src/crypto/hmac_drbg.cpp \
              src/crypto/toeplitz.cpp \
              src/crypto/self_test.cpp \
              external/imgui/imgui.cpp \
              external/imgui/imgui_draw.cpp \
              external/imgui/imgui_tables.cpp \
              external/imgui/imgui_widgets.cpp \
              external/imgui/backends/imgui_impl_win32.cpp \
              external/imgui/backends/imgui_impl_dx11.cpp \
              build/resource.res \
              -static \
              -Wl,--dynamicbase,--nxcompat,--high-entropy-va \
              -ldxgi -lshcore -luser32 -lgdi32 -limm32 -lcomdlg32 -lole32 -loleaut32 -luuid -lmmdevapi -lksuser

          echo "Build complete: build/TRNG.exe"

      - name: Record the toolchain that built TRNG.exe
        shell: msys2 {0}
        run: |
          {
            echo "Compiler: $(g++ --version | head -n 1)"
            echo "Linker:   $(ld --version | head -n 1)"
            echo "Resource compiler: $(windres --version | head -n 1)"
            echo
            echo "Installed MSYS2 packages:"
            pacman -Q
          } > build/TRNG-toolchain.txt
          cat build/TRNG-toolchain.txt

      - name: Keep TRNG.exe and the toolchain record for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trng-exe
          path: |
            build/TRNG.exe
            build/TRNG-toolchain.txt
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download TRNG.exe and the toolchain record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trng-exe

      - name: Write SHA-256 checksum
        run: sha256sum TRNG.exe > TRNG.exe.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            TRNG.exe
            TRNG-toolchain.txt

      - name: Upload TRNG.exe, checksum and toolchain record to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" TRNG.exe TRNG-toolchain.txt TRNG.exe.sha256 --clobber --repo "$GITHUB_REPOSITORY"
